name: Deploy Hugo site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .translation-cache.json
          key: ${{ runner.os }}-static-i18n-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-static-i18n-

      - name: Build English source site
        run: hugo --buildFuture --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Generate pre-translated static versions
        run: python scripts/build-static-translations.py public --languages pt-BR,es,zh-CN,ja

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
