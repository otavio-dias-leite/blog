<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Blog Admin — Otávio Leite</title>
<style>
:root{color-scheme:dark;--bg:#070707;--panel:#151011;--line:rgba(239,48,59,.25);--text:#f5f2f2;--muted:#aaa0a1;--red:#ff303b;--red2:#d51d2a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,rgba(105,12,20,.3),transparent 65%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif}
.wrap{width:min(1120px,calc(100% - 32px));margin:34px auto 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
.brand{color:var(--red);text-decoration:none;font:700 1rem monospace;letter-spacing:.08em}.muted{color:var(--muted)}h1,h2{line-height:1.2}h1{font-size:clamp(1.8rem,4vw,2.5rem);margin:28px 0 8px}h2{font-size:1.2rem}
.card{background:rgba(21,16,17,.92);border:1px solid var(--line);border-radius:13px;padding:22px;margin:20px 0;box-shadow:0 12px 40px #0005}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#211416;color:var(--text);font:600 .9rem inherit;text-decoration:none;cursor:pointer}
button:hover,.btn:hover{border-color:var(--red);background:#321518}.primary{background:var(--red2);border-color:var(--red);color:#fff}.danger{color:#ff858b;border-color:#85333a;background:#241114}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#0c090a;color:var(--text);padding:11px 12px;font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 2px #ff303b22}
label{display:block;font-size:.82rem;color:var(--muted);margin:13px 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#body{min-height:360px;resize:vertical;font:14px/1.65 ui-monospace,monospace}.post{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px 0;border-top:1px solid #ffffff12}.post strong{display:block}.post small{color:var(--muted)}.post-actions{display:flex;gap:8px;flex-shrink:0}
#preview{border:1px solid var(--line);border-radius:8px;padding:16px;min-height:100px;overflow-wrap:anywhere;background:#0b0808}#preview pre{white-space:pre-wrap}
#status{min-height:24px;color:var(--muted)}.hidden{display:none!important}.pill{font:12px monospace;color:#ff9ba0;border:1px solid var(--line);border-radius:20px;padding:3px 8px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.post{align-items:flex-start;flex-direction:column}.post-actions{width:100%}.post-actions button{flex:1}.card{padding:16px}}
</style></head>
<body><main class="wrap">
<header class="top"><a class="brand" href="/blog/">OTAVIO LEITE / BLOG ADMIN</a><div id="account" class="muted">Checking session…</div></header>
<section id="login" class="card hidden"><h1>Administração do blog</h1><p class="muted">Entre com o GitHub. Somente <strong>@otavio-dias-leite</strong> pode criar, editar ou excluir publicações.</p><a class="btn primary" href="/api/auth/login">Entrar com GitHub</a><p id="login-error" class="muted"></p></section>
<div id="app" class="hidden">
<section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1 style="margin:0">Publicações</h1><p class="muted">Crie, edite e remova arquivos Markdown do repositório.</p></div><button id="new" class="primary">+ Nova publicação</button></div><div id="posts" style="margin-top:18px"></div></section>
<section class="card" id="editor"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2 id="editor-title">Nova publicação</h2><span class="pill">MARKDOWN</span></div>
<form id="form">
<div class="grid"><div><label for="title">Título</label><input id="title" required maxlength="180" placeholder="Título do artigo"></div><div><label for="slug">Slug / nome do arquivo</label><input id="slug" maxlength="80" placeholder="gerado-do-titulo"></div></div>
<div class="grid"><div><label for="description">Descrição</label><input id="description" maxlength="240" placeholder="Resumo curto"></div><div><label for="lang">Idioma original</label><select id="lang"><option value="auto">Detectar automaticamente</option><option value="pt-BR">Português</option><option value="en">English</option><option value="zh">中文</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div></div>
<div class="grid"><div><label for="tags">Tags (separadas por vírgula)</label><input id="tags" placeholder="hardware, segurança, programação"></div><div><label for="categories">Categorias</label><input id="categories" placeholder="Projetos, Estudos"></div></div>
<label for="body">Conteúdo</label><div class="toolbar"><button type="button" data-wrap="**">Negrito</button><button type="button" data-prefix="## ">H2</button><button type="button" data-prefix="- ">Lista</button><button type="button" data-wrap="`">Código</button><button type="button" id="link">Link</button><button type="button" id="youtube">YouTube</button><button type="button" id="preview-toggle">Pré-visualizar</button></div>
<textarea id="body" required placeholder="# Comece a escrever em Markdown…"></textarea><div id="preview" class="hidden"></div>
<label style="display:flex;align-items:center;gap:9px"><input id="draft" type="checkbox" style="width:auto"> Salvar como rascunho</label>
<div class="toolbar"><button class="primary" type="submit" id="save">Publicar</button><button type="button" id="cancel">Cancelar</button><span id="status" role="status"></span></div></form></section>
</div></main>
<script>
const $=id=>document.getElementById(id);let posts=[],editing=null,sessionUser=null;
const api=async(url,options={})=>{const r=await fetch(url,{credentials:"same-origin",...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||"Erro HTTP "+r.status);return data};
function message(text,error=false){$("status").textContent=text;$("status").style.color=error?"#ff858b":"#aaa0a1"}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function simpleMarkdown(s){let x=escapeHTML(s);x=x.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/^&gt; (.*)$/gm,"<blockquote>$1</blockquote>").replace(/\n/g,"<br>");return x}
function renderPosts(){const box=$("posts");box.innerHTML="";if(!posts.length){box.textContent="Nenhuma publicação encontrada.";return}for(const p of posts){const row=document.createElement("div");row.className="post";const info=document.createElement("div");const title=document.createElement("strong");title.textContent=p.title||p.slug;const meta=document.createElement("small");meta.textContent=p.name+(p.draft?" · Rascunho":" · Publicado");info.append(title,meta);const actions=document.createElement("div");actions.className="post-actions";const edit=document.createElement("button");edit.textContent="Editar";edit.onclick=()=>editPost(p);const del=document.createElement("button");del.className="danger";del.textContent="Excluir";del.onclick=()=>deletePost(p);actions.append(edit,del);row.append(info,actions);box.append(row)}}
async function loadPosts(){const d=await api("/api/posts");posts=d.posts||[];renderPosts()}
function resetForm(){editing=null;$("form").reset();$("slug").value="";$("slug").disabled=false;$("lang").value="auto";$("editor-title").textContent="Nova publicação";$("save").textContent="Publicar";$("preview").classList.add("hidden");$("body").classList.remove("hidden");message("")}
function editPost(p){
 editing=p;
 const raw=String(p.raw||""),first=raw.indexOf("---"),second=raw.indexOf("---",first+3);
 const fm=first>=0&&second>first?raw.slice(first+3,second):"",body=second>first?raw.slice(second+3).trim():raw;
 const field=k=>{const m=fm.match(new RegExp("^"+k+":\\s*(.*)$","m"));if(!m)return "";try{return JSON.parse(m[1])}catch{return m[1].trim()}};
 const list=k=>{const v=field(k);return Array.isArray(v)?v.join(", "):String(v||"").replace("[","").replace("]","").replace(/["']/g,"")};
 $("editor-title").textContent="Editar publicação";$("save").textContent="Salvar alterações";
 $("title").value=p.title||p.slug;$("slug").value=p.slug;$("slug").disabled=true;
 $("description").value=field("description")||"";$("lang").value=field("lang")||"auto";
 $("tags").value=list("tags");$("categories").value=list("categories");
 $("body").value=body;$("draft").checked=!!p.draft;message("");$("editor").scrollIntoView({behavior:"smooth"});
}
async function deletePost(p){if(!confirm('Excluir "'+(p.title||p.slug)+'"? Esta ação remove o arquivo do repositório.'))return;try{await api("/api/posts",{method:"DELETE",body:JSON.stringify({name:p.name,sha:p.sha})});message("Publicação excluída.");await loadPosts()}catch(e){message(e.message,true)}}
$("form").addEventListener("submit",async e=>{e.preventDefault();$("save").disabled=true;message("Salvando…");const data={title:$("title").value,slug:$("slug").value,description:$("description").value,lang:$("lang").value,tags:$("tags").value,categories:$("categories").value,body:$("body").value,draft:$("draft").checked};if(editing)data.sha=editing.sha;try{const result=await api("/api/posts",{method:editing?"PUT":"POST",body:JSON.stringify(data)});message("Salvo no GitHub: "+result.name);resetForm();await loadPosts()}catch(err){message(err.message,true)}finally{$("save").disabled=false}});
$("new").onclick=()=>{resetForm();$("editor").scrollIntoView({behavior:"smooth"})};$("cancel").onclick=resetForm;
$("preview-toggle").onclick=()=>{$("preview").innerHTML=simpleMarkdown($("body").value);$("preview").classList.toggle("hidden");$("body").classList.toggle("hidden");$("preview-toggle").textContent=$("preview").classList.contains("hidden")?"Pré-visualizar":"Voltar ao editor"};
document.querySelectorAll("[data-wrap]").forEach(b=>b.onclick=()=>{const t=$("body"),a=t.selectionStart,z=t.selectionEnd,v=t.value;t.value=v.slice(0,a)+b.dataset.wrap+v.slice(a,z)+b.dataset.wrap+v.slice(z);t.focus()});
document.querySelectorAll("[data-prefix]").forEach(b=>b.onclick=()=>{const t=$("body"),a=t.selectionStart;t.value=t.value.slice(0,a)+b.dataset.prefix+t.value.slice(a);t.focus()});
$("link").onclick=()=>{const url=prompt("URL do link:");if(url){const t=$("body"),a=t.selectionStart,z=t.selectionEnd,txt=t.value.slice(a,z)||"texto";t.setRangeText("["+txt+"]("+url+")",a,z,"end");t.focus()}};
$("youtube").onclick=()=>{const id=prompt("ID do vídeo YouTube:");if(id)$("body").setRangeText('\n{{< youtube id="'+id+'" >}}\n',$("body").selectionStart,$("body").selectionEnd,"end")};
$("logout")?.addEventListener("click",async()=>{await api("/api/auth/logout",{method:"POST"});location.reload()});
(async()=>{try{const s=await api("/api/auth/session");if(!s.authenticated){$("login").classList.remove("hidden");$("account").textContent="Sessão não iniciada";return}sessionUser=s.user;$("app").classList.remove("hidden");$("account").innerHTML='<span>'+escapeHTML(sessionUser.login)+'</span> <button id="logout">Sair</button>';$("logout").onclick=async()=>{await api("/api/auth/logout",{method:"POST"});location.reload()};await loadPosts()}catch(e){$("login").classList.remove("hidden");$("login-error").textContent=e.message;$("account").textContent="Falha na autenticação"}})();
</script></body></html>
