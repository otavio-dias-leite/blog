<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Blog Admin</title><style>
:root{color-scheme:dark;--bg:#090611;--p:#171025;--line:#39264d;--fg:#f2eafa;--muted:#b9abc9;--a:#c8a4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#382052,transparent 60%),var(--bg);color:var(--fg);font:15px system-ui}.wrap{max-width:1150px;margin:auto;padding:20px}.top,.row,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px;margin-top:20px}.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:18px}.btn{background:#251936;color:var(--fg);border:1px solid var(--line);padding:10px 14px;border-radius:8px;cursor:pointer}.primary{background:var(--a);color:#160d20;font-weight:700}.field{display:grid;gap:6px;margin:12px 0}.field label,small,.muted{color:var(--muted)}input,textarea,select{width:100%;padding:10px;background:#0e0917;color:var(--fg);border:1px solid var(--line);border-radius:7px}textarea{min-height:300px;font:14px/1.6 monospace}.post{width:100%;text-align:left;margin:5px 0}.post small{display:block}.hidden{display:none!important}.status{overflow-wrap:anywhere;min-height:22px;color:var(--muted)}.error{color:#ff7185}.login{max-width:520px;margin:10vh auto}.code{font:700 25px monospace;letter-spacing:3px}.actions{justify-content:flex-start}@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><a href="/blog/" style="color:var(--a);font-weight:800;text-decoration:none">OTÁVIO LEITE / ADMIN</a><div><span id="who" class="muted"></span> <button id="logout" class="btn hidden">Sair</button></div></header>
<section id="login" class="card login"><h1>Entrar com GitHub</h1><p class="muted">Acesso restrito à conta @otavio-dias-leite. O painel altera arquivos diretamente no repositório.</p><button id="loginBtn" class="btn primary">Continuar com GitHub</button><p id="loginStatus" class="status" aria-live="polite"></p><div id="device" class="hidden"><p>Acesse <a id="verify" target="_blank" rel="noopener">github.com/login/device</a> e digite:</p><p id="code" class="code"></p></div></section>
<section id="app" class="hidden"><div class="grid"><aside class="card"><div class="row"><button id="new" class="btn primary">Novo post</button><button id="refresh" class="btn">Atualizar</button></div><input id="search" placeholder="Buscar posts…" style="margin-top:12px"><div id="list"></div></aside><section class="card"><h2 id="heading">Nova publicação</h2><div class="row"><div class="field" style="flex:1"><label>Título</label><input id="title"></div><div class="field" style="flex:1"><label>Slug</label><input id="slug"></div></div><div class="row"><div class="field" style="flex:1"><label>Data</label><input id="date" type="date"></div><div class="field" style="flex:1"><label>Idioma original</label><select id="lang"><option value="auto">Detecção automática</option><option value="pt">Português</option><option value="en">Inglês</option><option value="zh">Mandarim</option></select></div></div><div class="field"><label>Descrição</label><input id="description"></div><div class="row"><div class="field" style="flex:1"><label>Tags (vírgula)</label><input id="tags"></div><div class="field" style="flex:1"><label>Categorias (vírgula)</label><input id="categories"></div></div><div class="field"><label>Capa (URL)</label><input id="cover"></div><div class="field"><label>Conteúdo Markdown</label><textarea id="body"></textarea></div><div class="field"><label>Enviar imagem (máx. 2,5 MB)</label><input id="image" type="file" accept="image/*"></div><label><input id="draft" type="checkbox" style="width:auto"> Rascunho</label><div class="actions" style="margin-top:15px"><button id="save" class="btn primary">Salvar</button><button id="delete" class="btn hidden">Excluir</button></div><p id="status" class="status"></p></section></div></section></div>
<script>
(()=>{'use strict';const O='otavio-dias-leite',R='blog',B='main',CID='Ov23liPPAdbdY0w92XVC',K='otavio-blog-token';const $=x=>document.getElementById(x);let token=sessionStorage.getItem(K)||'',current='',posts=[];
const H=()=>({Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'});
async function gh(path,opt={}){const r=await fetch('https://api.github.com'+path,{...opt,headers:{...H(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'GitHub HTTP '+r.status);return d}
const dec=x=>new TextDecoder().decode(Uint8Array.from(atob(x.replace(/\n/g,'')),c=>c.charCodeAt(0))),enc=x=>{let b='';new TextEncoder().encode(x).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
const slug=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),q=x=>JSON.stringify(String(x??''));
function parse(md,s){let l=md.split(/\r?\n/),m={},e=l.indexOf('---',1),body=md;if(l[0]==='---'&&e>0){for(const x of l.slice(1,e)){let z=x.match(/^([\w-]+):\s*(.*)$/);if(z){try{m[z[1]]=JSON.parse(z[2])}catch{m[z[1]]=z[2]}}}body=l.slice(e+1).join('\n').replace(/^\n/,'')}return{slug:s,title:m.title||s,date:m.date||'',draft:!!m.draft,lang:m.lang||'auto',description:m.description||'',tags:m.tags||[],categories:m.categories||[],cover:m.cover||'',body}}
function md(){let a=['---','title: '+q($('title').value),'date: '+q($('date').value),'draft: '+$('draft').checked];if($('lang').value!=='auto')a.push('lang: '+q($('lang').value));if($('description').value)a.push('description: '+q($('description').value));for(const k of ['tags','categories']){let v=$(k).value.split(',').map(x=>x.trim()).filter(Boolean);if(v.length)a.push(k+': '+JSON.stringify(v))}if($('cover').value)a.push('cover: '+q($('cover').value));return a.concat(['',$('body').value.trimEnd(),'']).join('\n')}
function msg(t,e=false){$('status').textContent=t;$('status').className='status'+(e?' error':'')}
function fill(p){current=p?.slug||'';$('heading').textContent=current?'Editar: '+current:'Nova publicação';for(const k of ['title','slug','date','lang','description','cover','body'])$(k).value=p?.[k]|| (k==='date'?new Date().toISOString().slice(0,10):k==='lang'?'auto':'');for(const k of ['tags','categories'])$(k).value=(p?.[k]||[]).join(', ');$('draft').checked=!!p?.draft;$('delete').classList.toggle('hidden',!current);msg('')}
async function file(path){try{return await gh('/repos/'+O+'/'+R+'/contents/'+path+'?ref='+B)}catch(e){if(e.message.includes('Not Found'))return null;throw e}}
async function load(){msg('Carregando…');const fs=await gh('/repos/'+O+'/'+R+'/contents/content/posts?ref='+B);posts=await Promise.all(fs.filter(x=>x.type==='file'&&x.name.endsWith('.md')).map(async x=>{let f=await file('content/posts/'+x.name);return{...parse(dec(f.content),x.name.slice(0,-3)),sha:f.sha}}));posts.sort((a,b)=>String(b.date).localeCompare(String(a.date)));render();msg(posts.length+' posts carregados.')}
function render(){let q=$('search').value.toLowerCase();$('list').innerHTML='';posts.filter(p=>(p.title+' '+p.slug).toLowerCase().includes(q)).forEach(p=>{let b=document.createElement('button');b.className='btn post';b.innerHTML='<strong></strong><small></small>';b.querySelector('strong').textContent=p.title;b.querySelector('small').textContent=p.date+' · '+(p.draft?'Rascunho':'Publicado');b.onclick=()=>fill(p);$('list').append(b)})}
async function save(){let s=slug($('slug').value||$('title').value);if(!$('title').value.trim()||!s)return msg('Informe título e slug.',true);try{msg('Salvando no GitHub…');let path='content/posts/'+s+'.md',f=await file(path);if(current&&current!==s){let old=await file('content/posts/'+current+'.md');if(old)await gh('/repos/'+O+'/'+R+'/contents/content/posts/'+current+'.md',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Delete renamed post',sha:old.sha,branch:B})})}if(f&&s!==current)throw Error('Slug já existe.');let data={message:(current?'Update ':'Create ')+s,content:enc(md()),branch:B};if(f)data.sha=f.sha;await gh('/repos/'+O+'/'+R+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});current=s;await load();fill(posts.find(p=>p.slug===s));msg('Salvo. GitHub Actions publicará o site.')}catch(e){msg(e.message,true)}}
async function del(){if(!current||!confirm('Excluir este post?'))return;try{let f=await file('content/posts/'+current+'.md');await gh('/repos/'+O+'/'+R+'/contents/content/posts/'+current+'.md',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Delete post '+current,sha:f.sha,branch:B})});fill(null);await load()}catch(e){msg(e.message,true)}}
async function upload(f){if(!f)return;if(f.size>2621440)return msg('Imagem maior que 2,5 MB.',true);let ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/avif':'avif'}[f.type];if(!ext)return msg('Formato não suportado.',true);try{msg('Enviando imagem…');let b=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)}),name=slug(f.name.replace(/\.[^.]+$/,''))||'imagem',path='static/blog/uploads/'+Date.now()+'-'+name+'.'+ext;await gh('/repos/'+O+'/'+R+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Upload image '+name,content:b,branch:B})});let area=$('body');area.setRangeText('!['+f.name+'](/blog/uploads/'+path.split('/').pop()+')',area.selectionStart,area.selectionEnd,'end');msg('Imagem enviada e inserida.')}catch(e){msg(e.message,true)}finally{$('image').value=''}}
async function me(){let u=await gh('/user');if(u.login.toLowerCase()!==O)throw Error('Conta não autorizada');return u}
async function boot(){try{if(!token)throw Error('login');let u=await me();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent='@'+u.login;await load();fill(null)}catch{$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}}
async function login(){let b=$('loginBtn');b.disabled=true;try{$('loginStatus').textContent='Solicitando código…';let r=await fetch('https://github.com/login/device/code',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,scope:'public_repo'})}),d=await r.json();if(!r.ok||!d.device_code)throw Error(d.error_description||'Ative Device Flow no OAuth App');$('device').classList.remove('hidden');$('verify').href=d.verification_uri;$('code').textContent=d.user_code;$('loginStatus').textContent='Aguardando autorização…';let until=Date.now()+d.expires_in*1000;while(Date.now()<until){await new Promise(r=>setTimeout(r,Math.max(5,d.interval||5)*1000));let p=await fetch('https://github.com/login/oauth/access_token',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,device_code:d.device_code,grant_type:'urn:ietf:params:oauth:grant-type:device_code'})}),x=await p.json();if(x.access_token){token=x.access_token;let u=await me();sessionStorage.setItem(K,token);$('loginStatus').textContent='Autorizado como @'+u.login;await boot();return}if(x.error==='authorization_pending'||x.error==='slow_down')continue;throw Error(x.error_description||'Autorização recusada')}throw Error('Código expirado')}catch(e){$('loginStatus').textContent=e.message}finally{b.disabled=false}}
$('loginBtn').onclick=login;$('logout').onclick=()=>{sessionStorage.removeItem(K);token='';location.reload()};$('new').onclick=()=>fill(null);$('refresh').onclick=()=>load().catch(e=>msg(e.message,true));$('save').onclick=save;$('delete').onclick=del;$('search').oninput=render;$('image').onchange=e=>upload(e.target.files[0]);boot();
})();
</script></body></html>
