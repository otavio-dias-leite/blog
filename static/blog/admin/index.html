<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Admin — Otávio Leite</title>
  <style>
    :root{color-scheme:dark;background:#090611;color:#eff7fc;font:15px system-ui,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px}
    p{color:#b9abc9}
  </style>
</head>
<body>
  <p>Carregando…</p>
  <script>
    (async () => {
      try {
        const response = await fetch('/api/admin', {
          credentials: 'same-origin',
          cache: 'no-store',
          headers: { Accept: 'text/html' }
        });
        if (!response.ok) throw new Error('Admin unavailable');
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch {
        window.location.replace('/api/admin');
      }
    })();
  </script>
</body>
</html>
