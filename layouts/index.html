{{ define "main" }}
<section class="post-list">
  {{ $posts := where site.RegularPages "Section" "posts" }}
  {{ range sort $posts "Date" "desc" }}
  <article class="post">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  </article>
  {{ end }}
</section>
{{ end }}
