<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
  <meta name="description" content="Personal blog by Otávio Leite.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
  <div class="background-bolt" aria-hidden="true">⚡</div>

  <header class="site-header">
    <div class="shell">
      <a class="brand" href="{{ "/" | relURL }}"><span class="brand-bolt">⚡</span>Otávio Leite</a>
    </div>
  </header>

  <main class="shell posts">
    {{ range .Site.RegularPages.ByDate.Reverse }}
      <article class="post-row">
        <a class="post-link" href="{{ .RelPermalink }}">
          <div class="post-date">{{ .Date.Format "02.01.2006" }}</div>
          <h2>{{ .Title }}</h2>
        </a>
        <span class="post-mark">↗</span>
      </article>
    {{ end }}
  </main>
</body>
</html>
