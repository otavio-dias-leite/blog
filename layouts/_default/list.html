{{ define "main" }}
<section class="post-list-page">
  <div class="section-head"><h1>{{ .Title }}</h1><span class="section-kicker">FIELD NOTES / JOURNAL</span></div>
  <div class="post-list">
    {{ range sort .Pages "Date" "desc" }}
    <a class="post-card" href="{{ .RelPermalink }}">
      <time class="post-meta" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
      <span class="post-card-content"><strong>{{ .Title }}</strong>
      {{ with .Description }}<span class="post-excerpt">{{ . }}</span>{{ else }}<span class="post-excerpt">{{ .Summary | plainify | truncate 180 }}</span>{{ end }}</span>
      <span class="post-arrow" aria-hidden="true">↗</span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
