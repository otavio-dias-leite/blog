<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080d">
<title>{{ .Title }} — {{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
<header>
  <div class="wrap header-main">
    <a class="brand" href="{{ "/blog" | relURL }}"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.4 1.8 5.8 13h5.1l-.5 9.2L18.3 10h-5.2l.3-8.2Z"/></svg><span>Otávio Leite</span></a>
    <nav class="language-switch" aria-label="Language"><button type="button" data-blog-language="en-US" aria-pressed="true" class="active">EN-US</button><button type="button" data-blog-language="pt-BR" aria-pressed="false">PT-BR</button><button type="button" data-blog-language="zh-CN" aria-label="Mandarin, Simplified Chinese" aria-pressed="false">中文</button></nav>
  </div>
  <div class="header-sub"><div class="wrap"><a href="https://otavio-dias-leite.github.io/portfolio/">Portfolio</a><a class="current" href="{{ "/blog" | relURL }}">Blog</a></div></div>
</header>
<main class="wrap article" data-post-slug="{{ .File.ContentBaseName }}" data-post-language="{{ .Params.lang | default "auto" }}"><time>{{ .Date.Format "02.01.2006" }}</time><h1 data-post-title>{{ .Title }}</h1><div class="content" data-post-content>{{ .Content }}</div>
<div class="comments"><script src="https://utteranc.es/client.js" repo="otavio-dias-leite/blog" issue-term="pathname" theme="github-dark" crossorigin="anonymous" async></script></div>
</main>
<footer><div class="wrap"><strong>Otávio Leite</strong> · Blog</div></footer>
<script src="{{ "language.js" | relURL }}" defer></script></body></html>
