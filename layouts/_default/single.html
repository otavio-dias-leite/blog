<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ .Title }} — {{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body><div class="bolt">⚡</div>
<header><div class="wrap"><a class="brand" href="{{ "/blog" | relURL }}">⚡ Otávio Leite</a><nav class="language-switch"><button type="button" onclick="blogLanguage('en')">EN</button><button type="button" onclick="blogLanguage('pt-BR')">PT-BR</button></nav></div></header>
<main class="wrap article"><time>{{ .Date.Format "02.01.2006" }}</time><h1>{{ .Title }}</h1><div class="content">{{ .Content }}</div>
<div class="comments"><script src="https://utteranc.es/client.js" repo="otavio-dias-leite/blog" issue-term="pathname" theme="github-dark" crossorigin="anonymous" async></script></div>
</main><span id="google_translate_element"></span><script>function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:"pt",includedLanguages:"en,pt",autoDisplay:false},"google_translate_element")}function blogLanguage(l){if(l==="pt-BR"){document.cookie="googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";document.cookie="googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/blog";}else{document.cookie="googtrans=/pt/en;path=/";document.cookie="googtrans=/pt/en;path=/blog";}location.reload()}</script><script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script></body></html>
