<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ .Title }} — {{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body><div class="bolt">⚡</div>
<header><div class="wrap"><a class="brand" href="{{ "/" | relURL }}">⚡ Otávio Leite</a></div></header>
<main class="wrap article"><time>{{ .Date.Format "02.01.2006" }}</time><h1>{{ .Title }}</h1><div class="content">{{ .Content }}</div>
<div class="comments"><script src="https://utteranc.es/client.js" repo="otavio-dias-leite/blog" issue-term="pathname" theme="github-dark" crossorigin="anonymous" async></script></div>
</main></body></html>
