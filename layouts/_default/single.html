<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ .Title }} — {{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body><div class="lock-watermark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="15" height="11" rx="2.2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14.2v2.7"/></svg></div>
<header><div class="wrap"><a class="brand" href="{{ "/blog" | relURL }}"><svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4.5" y="10" width="15" height="11" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 14.2v2.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Otávio Leite</span></a><nav class="language-switch" aria-label="Language"><button type="button" data-blog-language="en-US" aria-pressed="true" class="active">EN-US</button><button type="button" data-blog-language="pt-BR" aria-pressed="false">PT-BR</button></nav></div></header>
<main class="wrap article" data-post-slug="{{ .File.ContentBaseName }}"><time>{{ .Date.Format "02.01.2006" }}</time><h1 data-post-title>{{ .Title }}</h1><div class="content" data-post-content>{{ .Content }}</div>
<div class="comments"><script src="https://utteranc.es/client.js" repo="otavio-dias-leite/blog" issue-term="pathname" theme="github-dark" crossorigin="anonymous" async></script></div>
</main><script src="{{ "language.js" | relURL }}" defer></script></body></html>
