<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b12"><meta name="description" content="{{ .Description | default .Summary | plainify | htmlEscape }}">
<title>{{ .Title }} — {{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
<a class="skip-link" href="#article-content">Skip to article</a>
<header><div class="wrap">
<a class="brand" href="{{ "/" | relURL }}"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.4 1.8 5.8 13h5.1l-.5 9.2L18.3 10h-5.2l.3-8.2Z"/></svg></span><span>Otávio Leite</span></a>
<div class="header-actions">
<nav class="language-switch" aria-label="Language selector">
<button type="button" data-blog-language="en-US" aria-pressed="true" class="active" lang="en">EN</button>
<button type="button" data-blog-language="pt-BR" aria-pressed="false" lang="pt-BR">PT</button>
<button type="button" data-blog-language="zh-CN" aria-label="Simplified Chinese" aria-pressed="false" lang="zh-CN">中文</button>
</nav>
<a class="admin-link" href="/blog/admin/" aria-label="Open administration" title="Administration"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="m19.4 13.5 1.1.9-1.1 1.9-1.4-.4a7.8 7.8 0 0 1-1.3.8l-.3 1.5h-2.2l-.5-1.4a7.7 7.7 0 0 1-1.5 0l-.7 1.2-2-.9.2-1.5a7.7 7.7 0 0 1-1.1-1.1l-1.5.2-.8-2 1.2-.8a7.7 7.7 0 0 1 0-1.5l-1.2-.8.8-2 1.5.2a7.7 7.7 0 0 1 1.1-1.1l-.2-1.5 2-.9.7 1.2a7.7 7.7 0 0 1 1.5 0l.5-1.4h2.2l.3 1.5a7.8 7.8 0 0 1 1.3.8l1.4-.4 1.1 1.9-1.1.9a7.7 7.7 0 0 1 0 1.5Z"/></svg></a>
</div></div></header>
<div class="translation-status" role="status" aria-live="polite" aria-atomic="true"></div>
<main class="wrap article-shell">
<article class="article" data-post-slug="{{ .File.ContentBaseName }}" data-post-language="{{ .Params.lang | default "auto" }}">
<a class="back-link" href="{{ "/" | relURL }}">← <span data-translate>All articles</span></a>
<header class="article-header">
<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 January 2006" }}</time>
<h1 data-post-title>{{ .Title }}</h1>
<div class="article-meta"><span data-translate>{{ .ReadingTime }} min read</span>{{ with .Params.categories }}<span>·</span><span>{{ delimit . ", " }}</span>{{ end }}</div>
</header>
<div class="content" id="article-content" data-post-content>{{ .Content }}</div>
<div class="comments"><h2 data-translate>Discussion</h2><script src="https://utteranc.es/client.js" repo="otavio-dias-leite/blog" issue-term="pathname" theme="github-dark" crossorigin="anonymous" async></script></div>
</article></main>
<footer><div class="wrap">© {{ now.Year }} Otávio Leite</div></footer>
<script src="{{ "language.js" | relURL }}" defer></script></body></html>
