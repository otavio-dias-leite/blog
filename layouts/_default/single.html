<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ .Title }} — {{ .Site.Title }}</title>
<meta name="description" content="{{ .Description | default .Summary | plainify | htmlEscape }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type" content="article"><meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Description | default .Summary | plainify | htmlEscape }}">
<meta property="og:url" content="{{ .Permalink }}"><meta property="og:site_name" content="Otávio Leite">
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
<meta name="twitter:card" content="summary"><meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ .Description | default .Summary | plainify | htmlEscape }}">
{{ if .Params.projectTranslation }}
<link rel="alternate" hreflang="pt-BR" href="{{ .Site.BaseURL }}posts/mp3-player/">
<link rel="alternate" hreflang="en" href="{{ .Site.BaseURL }}posts/mp3-player-en/">
<link rel="alternate" hreflang="zh-CN" href="{{ .Site.BaseURL }}posts/mp3-player-zh/">
<link rel="alternate" hreflang="x-default" href="{{ .Site.BaseURL }}posts/mp3-player-en/">
{{ end }}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","headline":{{ .Title | jsonify }},"description":{{ (.Description | default .Summary | plainify) | jsonify }},"datePublished":{{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},"url":{{ .Permalink | jsonify }},"author":{"@type":"Person","name":"Otávio Leite"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body><div class="lock-watermark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.4 1.8 5.8 13h5.1l-.5 9.2L18.3 10h-5.2l.3-8.2Z"/></svg></div>
<header><div class="wrap"><a class="brand" href="{{ "/blog" | relURL }}"><svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.4 1.8 5.8 13h5.1l-.5 9.2L18.3 10h-5.2l.3-8.2Z" fill="currentColor"/></svg><span>Otávio Leite</span></a>
<nav class="lang language-switch" aria-label="Language"><button type="button" data-blog-language="en-US" aria-pressed="true" class="active">EN-US</button><button type="button" data-blog-language="pt-BR" aria-pressed="false">PT-BR</button><button type="button" data-blog-language="zh-CN" aria-label="Mandarin, Simplified Chinese" aria-pressed="false">中文</button></nav></div></header>
<main class="wrap article" data-post-slug="{{ .File.ContentBaseName }}" data-post-language="{{ .Params.lang | default "auto" }}"><time>{{ .Date.Format "02.01.2006" }}</time><h1 data-post-title>{{ .Title }}</h1><div class="content" data-post-content>{{ .Content }}</div>
<div class="comments"><script src="https://utteranc.es/client.js" repo="otavio-dias-leite/blog" issue-term="pathname" theme="github-dark" crossorigin="anonymous" async></script></div>
</main><script src="{{ "language.js" | relURL }}" defer></script></body></html>
