<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
  <meta name="description" content="Personal blog by Otávio Leite.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
  <div class="background-bolt" aria-hidden="true">⚡</div>

  <header class="site-header">
    <div class="shell">
      <a class="brand" href="{{ "/" | relURL }}"><span class="brand-bolt">⚡</span>Otávio Leite</a>
    </div>
  
<div class="translate-wrap">
  <label for="site-language" class="sr-only">Language</label>
  <select id="site-language" aria-label="Language">
      <option value="pt">Português</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="ru">Русский</option>
      <option value="ar">العربية</option>
      <option value="nl">Nederlands</option>
      <option value="pl">Polski</option>
      <option value="tr">Türkçe</option>
      <option value="uk">Українська</option>
      <option value="sv">Svenska</option>
      <option value="da">Dansk</option>
      <option value="no">Norsk</option>
      <option value="fi">Suomi</option>
      <option value="cs">Čeština</option>
      <option value="el">Ελληνικά</option>
      <option value="he">עברית</option>
      <option value="hi">हिन्दी</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="vi">Tiếng Việt</option>
      <option value="th">ไทย</option>
      <option value="ro">Română</option>
      <option value="hu">Magyar</option>
      <option value="bg">Български</option>
      <option value="sk">Slovenčina</option>
      <option value="sl">Slovenščina</option>
      <option value="ca">Català</option>
      <option value="eu">Euskara</option>
      <option value="gl">Galego</option>
      <option value="fa">فارسی</option>
      <option value="sw">Kiswahili</option>
      <option value="af">Afrikaans</option>
      <option value="ms">Bahasa Melayu</option>
      <option value="tl">Tagalog</option>
      <option value="bn">বাংলা</option>
      <option value="ta">தமிழ்</option>
      <option value="te">తెలుగు</option>
      <option value="ur">اردو</option>
  </select>
</div>
<div id="google_translate_element" class="google-widget" aria-hidden="true"></div>
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'pt',
      autoDisplay: false,
      includedLanguages: 'pt,en,es,fr,de,it,ja,ko,zh-CN,zh-TW,ru,ar,nl,pl,tr,uk,sv,da,no,fi,cs,el,he,hi,id,vi,th,ro,hu,bg,sk,sl,ca,eu,gl,fa,sw,af,ms,tl,bn,ta,te,ur'
    }, 'google_translate_element');
  }

  (function () {
    function wireLanguageSelector() {
      const custom = document.getElementById('site-language');
      const native = document.querySelector('.goog-te-combo');
      if (!custom || !native) return false;

      custom.addEventListener('change', function () {
        native.value = this.value || 'pt';
        native.dispatchEvent(new Event('change'));
      });

      const current = document.documentElement.lang || 'pt';
      if ([...custom.options].some(o => o.value === current)) custom.value = current;
      return true;
    }

    const observer = new MutationObserver(function () {
      if (wireLanguageSelector()) observer.disconnect();
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
    setTimeout(wireLanguageSelector, 1500);
  })();
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</header>

  <main class="shell posts">
    {{ range .Site.RegularPages.ByDate.Reverse }}
      <article class="post-row">
        <a class="post-link" href="{{ .RelPermalink }}">
          <div class="post-date">{{ .Date.Format "02.01.2006" }}</div>
          <h2>{{ .Title }}</h2>
        </a>
        <span class="post-mark">↗</span>
      </article>
    {{ end }}
  </main>
</body>
</html>
